# MIDI Conversion Configuration
# Default for new projects. Per-project overrides live in
# user_files/<n> - <name>/midiconfig.yaml. Schema-driven surface:
# webui/settings_schema.py::SETTINGS_REGISTRY (the single source
# of truth for active tuning knobs).
#
# Two deprecated filters are still wired but default to
# large-bypass values so they don't filter anything by default:
#   attack_rise_max_ms: 15000  (real toms < 20ms; FPs 100-500ms;
#                              15000 is "off for everything")
#   min_decay_col_min_db: -160.0  (real toms -60 to -84 dB; FPs
#                              -84 to -90 dB; -160 is "off")
# Per-stem overrides can tighten these to bring the filter back.
#
# Dead keys removed in the 2026-06-20 PGA-universal cleanup (do
# not re-add): per-stem expected_clusters, threshold_db,
# min_peak_spacing_ms, min_absolute_energy, merge_window_ms,
# energy_method, peak_hold_ms, onset_threshold, onset_delta,
# onset_wait, min_strength_threshold, min_sustain_ms,
# enable_spectral_filter, reverb_continuation_attack_threshold.
# Sections removed: filtering.*, clustering.method,
# threshold_optimization.*, debug.*, learning_mode.*.

# === AUDIO PROCESSING ===
audio:
  force_mono: true                       # Convert stereo to mono (overridden by per-stem use_stereo)
  silence_threshold: 0.001               # Amplitude below which audio is considered silent (-60 dB)
  normalize_amplitude: false             # Scale audio to target amplitude before detection
  target_amplitude: 0.8                  # Target peak amplitude (0-1 range)
  normalize_stereo_balance: false        # Equalize L/R RMS for fair stereo detection
  default_note_duration: 0.1             # Default duration for last note (seconds)
  very_short_duration: 0.01              # Very short note duration for MIDI output (beats)
  # --- DORMANT (declared but not read by pipeline) ---
  # min_segment_length: 512
  # peak_window_sec: 0.1
  # sustain_window_sec: 0.2
  # envelope_threshold: 0.1
  # envelope_smooth_kernel: 51

# === MIDI OUTPUT ===
midi:
  min_velocity: 1                        # Minimum MIDI velocity (1-127)
  max_velocity: 127                      # Maximum MIDI velocity (1-127)
  default_tempo: 120.0                   # Default tempo in BPM
  max_note_duration: 0.5                 # Maximum duration for any note (seconds)

# === ONSET DETECTION / PGA TUNING ===
# Per-stem overrides for any of the <stem>.pga_* keys below
# win over these globals. The pga_min_* values are also filter
# thresholds — see stems_to_midi/filter_registry.json for the
# full spec.
onset_detection:
  hop_length: 512                        # STFT hop for the broad-band envelope (samples)
  use_pga_detection: false               # Global "documentation" key. Per-stem use_pga_detection is what runs.

  # PGA percentile-gated detector tuning. Per-stem overrides
  # are the live tuning surface; globals are module-defaults.
  pga_min_prominence: 3000               # Filter PGA events with prominence below this
  pga_min_envelope_value: 1000           # Filter PGA events with envelope_value below this
  pga_min_combined_score: 0              # Filter PGA events with combined_score below this (warble separator; 0 = off)
  pga_abs_envelope_threshold: null       # null = IQR-auto (q3 + 2.5*IQR). Per-stem override for narrow-DR stems.
  pga_max_floor_gate_db: -60.0           # Clamp the percentile-gated noise-floor lift to this dB
  pga_broad_freq_min_hz: null            # null = module default (600.0 Hz; excludes 0-600Hz low bands on toms)
  pga_broad_freq_max_hz: null            # null = module default (8000.0 Hz)
  pga_db_rise_threshold: null            # null = module default (10.0 dB; an order of magnitude above noise)
  pga_nms_min_frames: null               # null = module default (20; ~116ms at hop=256)
  pga_strike_offset_sec: null            # null = module default (0.008 s; Hann center-of-bin bias)
  pga_detection_method: null             # null = module default ('envelope'). 'delta' for low-energy stems.

  # DEPRECATED filters — still wired in the pipeline but the
  # PGA prominence + envelope + combined_score chain usually
  # catches what these used to. Defaults are large-bypass to
  # keep them OFF; per-stem overrides can tighten to activate.
  attack_rise_max_ms: 15000              # DEPRECATED. Real toms < 20ms; FPs 100-500ms. 15000 = OFF.
  min_decay_col_min_db: -160.0           # DEPRECATED. Real toms -60 to -84 dB; FPs -84 to -90 dB. -160 = OFF.
  # --- REMOVED-IN-PGA-CLEANUP (do not re-add) ---
  # threshold: 0.3
  # delta: 0.01
  # wait: 3

# === KICK ===
kick:
  midi_note: 36                          # C2 - Bass Drum 1 (General MIDI)
  use_pga_detection: true
  use_stereo: false                      # Kick is typically centered; stereo adds noise
  # Per-stem PGA tuning (override the onset_detection.* globals above when needed):
  pga_min_prominence: null               # inherit onset_detection.pga_min_prominence
  pga_min_envelope_value: null           # inherit onset_detection.pga_min_envelope_value
  pga_min_combined_score: null           # inherit onset_detection.pga_min_combined_score
  # DEPRECATED filters — set per-stem if you want them active:
  # attack_rise_max_ms: 15000            # usually leave OFF for kick
  # min_decay_col_min_db: -160.0         # usually leave OFF for kick
  # --- DORMANT spectral band keys (compat only) ---
  # fundamental_freq_min: 40
  # fundamental_freq_max: 80
  # body_freq_min: 80
  # body_freq_max: 250
  # attack_freq_min: 1500
  # attack_freq_max: 5000

# === SNARE ===
snare:
  midi_note: 38                          # D2 - Acoustic Snare
  midi_note_rimshot: 37                  # C#2 - Acoustic Snare (rim)
  midi_note_clap: 39                     # D#2 - Hand Clap
  use_pga_detection: true
  use_stereo: true                       # Ghost notes and rimshots may be panned
  expected_clusters: 2                   # 1-3; default 2 (head + rim/clap separated by k-means)
  cluster_feature: null                  # null = 'spectral_centroid_hz'; override e.g. 'stereo_width' for panning-based separation
  min_cluster_spread_ratio: 0.10         # K-means spread guardrail (relative IQR; 0.10 = standard)
  # Pitch detection (used by some k-means feature paths):
  enable_pitch_detection: false
  pitch_method: yin                      # 'yin' or 'pyin'
  min_pitch_hz: 100.0
  max_pitch_hz: 500.0
  # Per-stem PGA tuning:
  pga_min_prominence: null
  pga_min_envelope_value: null
  pga_min_combined_score: null
  # DEPRECATED filters — example active values for snare:
  # attack_rise_max_ms: 500              # real snare < 100ms; FPs 200-500ms; 500 = permissive
  # min_decay_col_min_db: -120.0         # conservative off; tune tighter if FPs persist
  # --- DORMANT spectral band keys (compat only) ---
  # low_freq_min: 40
  # low_freq_max: 150
  # body_freq_min: 150
  # body_freq_max: 400
  # wire_freq_min: 2000
  # wire_freq_max: 8000

# === TOMS ===
toms:
  midi_note_low: 45                      # A2 - Low Tom
  midi_note_mid: 47                      # B2 - Mid Tom
  midi_note_high: 50                     # D3 - High Tom
  use_pga_detection: true
  use_stereo: true                       # Toms are often panned L-R; stereo helps identification
  expected_clusters: 3                   # 1-4; 3 = low/mid/high (standard)
  cluster_feature: null
  min_cluster_spread_ratio: 0.10
  enable_pitch_detection: true           # Used by cluster_feature='spectral_centroid_hz'
  pitch_method: yin
  min_pitch_hz: 60
  max_pitch_hz: 250
  # Per-stem PGA tuning (most stems need per-stem overrides because
  # the global envelope_value 1000 is calibrated for saturated stems):
  pga_min_prominence: null
  pga_min_envelope_value: null
  pga_min_combined_score: null
  # DEPRECATED filters — example active values for toms:
  # attack_rise_max_ms: 20.0             # real toms < 20ms; FPs 100-500ms
  # min_decay_col_min_db: -80.0          # real toms -60 to -84 dB; FPs -84 to -90 dB
  # --- DORMANT spectral band keys ---
  # fundamental_freq_min: 60
  # fundamental_freq_max: 150
  # body_freq_min: 150
  # body_freq_max: 400
  # --- DORMANT spectral-snap detector (spectral transient detector
  # these keys were meant to configure no longer runs) ---
  # spectral_snap_bands: [2, 3]
  # spectral_snap_min_delta: 0.05
  # --- DORMANT WebUI-only display flags (read by /api/projects,
  # not by pipeline) ---
  # show_only_snap_events: false
  # band_max_ratio_max: 2.0
  # onset_events_enabled: true

# === HIHAT ===
hihat:
  midi_note: 42                          # F#1 - Closed Hi-Hat (default for backward compat)
  midi_note_closed: 42                   # F#1 - Closed Hi-Hat
  midi_note_open: 46                     # A#1 - Open Hi-Hat
  midi_note_foot_close: 44               # G#1 - Foot close (pedal closes open hihat)
  midi_note_handclap: 39                 # D#1 - Hand Clap (detected from hihat bleed)
  use_pga_detection: true
  use_stereo: true                       # Hi-hat may be off-center; stereo helps detection
  normalize_amplitude: true              # Override global; hihats benefit most from normalization
  normalize_stereo_balance: true         # Override global; equalize L/R channels

  # Hihat open/closed classifier. Two active knobs:
  open_decay_slope_max: 0.7              # open if decay_slope < 0.7 (legacy fallback)
  openness_score_threshold: 0.75         # open if openness_score >= 0.75 (production; 2026-06-29)

  # Per-stem PGA tuning:
  pga_min_prominence: null
  pga_min_envelope_value: null
  pga_min_combined_score: null
  # DEPRECATED filters — usually leave OFF for hihat (hihat
  # tail is long enough to fail these — they're not informative):
  # attack_rise_max_ms: 10000
  # min_decay_col_min_db: -120.0
  # --- DORMANT flags (not read by runtime) ---
  # classifier_method: 'slope'           # 'slope' or 'kmeans'; test-only, not wired
  # min_sustain_ms: 25                   # legacy open/closed threshold
  # generate_foot_close: false           # legacy flag, not wired
  # open_geomean_min: 800.0              # legacy fallback only (pre-2026-06-19 sidecars)
  # open_sustain_ms: 100.0               # legacy fallback only (pre-2026-06-19 sidecars)
  # --- DORMANT spectral band keys ---
  # body_freq_min: 500
  # body_freq_max: 2000
  # sizzle_freq_min: 6000
  # sizzle_freq_max: 12000

# === CYMBALS ===
cymbals:
  midi_note: 57                          # Crash 2 (default for backward compat)
  midi_note_crash: 49                    # C#2 - Crash Cymbal 1
  midi_note_ride: 51                     # D#2 - Ride Cymbal 1
  midi_note_chinese: 52                  # E2 - Chinese Cymbal
  use_pga_detection: true
  use_stereo: true                       # Cymbals often panned L/R for crash/ride distinction
  expected_clusters: 2                   # 1-3; default 2 (crash/ride split)
  cluster_feature: null
  min_cluster_spread_ratio: 0.10
  # Per-stem PGA tuning (cymbals: envelope_value is HIGH — 16k+):
  pga_min_prominence: null
  pga_min_envelope_value: null
  pga_min_combined_score: null
  pga_detection_method: null             # null = 'envelope'; 'delta' for very-low-energy cymbal stacks
  # DEPRECATED filters — example active values for cymbals:
  # attack_rise_max_ms: 500
  # min_decay_col_min_db: -100.0
  # --- DORMANT spectral band keys ---
  # body_freq_min: 1000
  # body_freq_max: 4000
  # brilliance_freq_min: 4000
  # brilliance_freq_max: 10000
  # --- DORMANT envelope-analysis keys (legacy) ---
  # sustain_analysis_window_sec: 2.0
  # decay_filter_window_sec: 0.5

