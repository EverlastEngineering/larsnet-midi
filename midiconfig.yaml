# MIDI Conversion Configuration
# Settings for converting drum stems to MIDI notes

# === AUDIO PROCESSING ===
audio:
  # Legacy mono conversion (DEPRECATED - use per-stem use_stereo instead)
  force_mono: true  # Convert stereo to mono (overridden by per-stem use_stereo settings)
  
  # Silence detection
  silence_threshold: 0.001  # Amplitude below which audio is considered silent (-60dB)
  min_segment_length: 512  # Minimum audio segment length for analysis (samples)
  
  # Amplitude normalization (helps with quiet/loud recordings)
  normalize_amplitude: false  # Scale audio to target amplitude before detection
  target_amplitude: 0.8  # Target peak amplitude (0-1 range)
  normalize_stereo_balance: false  # Equalize L/R RMS for fair stereo detection
  
  # Peak amplitude measurement (for velocity calculation)
  peak_window_sec: 0.1  # Window size for measuring peak amplitude after onset
  
  # Sustain/duration measurement (envelope analysis)
  sustain_window_sec: 0.2  # Window size for analyzing sound decay
  envelope_threshold: 0.1  # Threshold as fraction of peak (0.1 = 10%)
  envelope_smooth_kernel: 51  # Median filter kernel size (must be odd)
  
  # MIDI timing defaults
  default_note_duration: 0.1  # Default duration for last note (seconds)
  very_short_duration: 0.01  # Very short note duration for MIDI output (beats)

# === LIBROSA DETECTION (OLD METHOD - use_librosa_detection: true per-stem) ===
onset_detection:
  threshold: 0.3       # librosa: onset strength threshold (0-1)
  delta: 0.01          # librosa: peak picking sensitivity
  wait: 3              # librosa: minimum frames between peaks
  hop_length: 512      # BOTH: samples between frames (affects time resolution)
  # Per-stem overrides: onset_threshold, onset_delta, onset_wait
  
# === ENERGY-BASED DETECTION (NEW METHOD - DEFAULT) ===
energy_detection:
  use_librosa_detection: false  # false = energy-based (default), true = librosa
  threshold_db: 15.0            # energy: prominence threshold (dB above local minimum)
  min_peak_spacing_ms: 100.0    # energy: minimum spacing between peaks
  min_absolute_energy: 0.01     # energy: noise floor threshold
  merge_window_ms: 150.0        # energy: L/R merge window for stereo
  use_stereo: true              # energy: detect in stereo and calculate pan
  onset_merge_window_ms: 100    # energy: merge nearby onsets within this window
  energy_method: 'peak_hold'    # energy: envelope method ('rms', 'spectral', 'peak_hold')
  peak_hold_ms: 3.0             # energy: peak-hold smoothing window (2-5ms typical, DAW waveform)

# === SPECTRAL FILTERING ===
filtering:
  geomean_threshold: null  # per-stem: minimum spectral energy (geometric mean)
  min_strength_threshold: null  # per-stem: minimum onset strength
  min_sustain_ms: null  # per-stem: minimum sustain duration
  expected_clusters: null  # per-stem: expected number of sound types
  enable_spectral_filter: true  # per-stem: enable/disable spectral filtering
  reverb_continuation_attack_threshold: 0.4  # attack_sharpness threshold: real hits >= 0.4, reverb/echo < 0.4

# === PER-STEM OVERRIDES ===
# Energy-based params: threshold_db, min_peak_spacing_ms, min_absolute_energy, merge_window_ms, energy_method, peak_hold_ms
# Librosa params: onset_threshold, onset_delta, onset_wait, use_librosa_detection: true

kick:
  # Kick drum (bass drum) settings
  midi_note: 36
  
  # Stereo processing
  use_stereo: false  # Kick is typically centered, no benefit from stereo analysis
  
  # Clustering configuration
  onset_merge_window_ms: 100  # Merge L/R onsets within this window (ms)
  expected_clusters: 1        # Expected number of distinct kick sounds (usually 1)
  
  # Detection method selection (NEW: energy-based is default)
  # use_librosa_detection: false  # Set to true for A/B testing with old method
  
  # Energy-based detection parameters
  threshold_db: 12.0              # Lower for kicks (sharp, obvious transients)
  min_peak_spacing_ms: 50.0       # Kicks can be faster than cymbals (double-kick)
  min_absolute_energy: 0.02       # Higher noise floor (kicks are loud)
  merge_window_ms: 100.0          # L/R merge window
  energy_method: 'peak_hold'      # Envelope calculation method
  peak_hold_ms: 3.0               # Peak-hold smoothing window
  
  # Onset detection (LEGACY - only used if use_librosa_detection: true)
  onset_threshold: 0.1      # Kicks are loud and easy to detect
  onset_delta: 0.1          # Global setting
  onset_wait: 2             # ~22ms minimum spacing
  
  # TWO-PASS FILTERING SYSTEM for kick drums
  # Pass 1: Spectral filtering (GeoMean threshold)
  # Pass 2: Statistical outlier detection (optional, catches snare bleed)
  
  # Pass 1: Spectral filtering uses FFT analysis to distinguish real kicks from artifacts
  # Real kick has energy in fundamental (40-80Hz), body (80-250Hz), and attack (1.5-5kHz)
  # Artifacts (snare bleed, clicks) have low energy in one or more ranges
  
  geomean_threshold: 800.0  # Geometric mean of fundamental+body+attack energy (3-way: cube root)
                              # Real kicks: 500-2000, Artifacts: 50-400
                              # High threshold filters out most bleed and artifacts
  
  # Spectral ranges for analysis (Hz)
  fundamental_freq_min: 40   # Start of fundamental range (deep bass)
  fundamental_freq_max: 80   # End of fundamental range
  body_freq_min: 80          # Start of body/attack range
  body_freq_max: 250         # End of body/attack range
  attack_freq_min: 1500      # Start of beater attack range
  attack_freq_max: 5000      # End of beater attack range
  
  # Statistical outlier filtering (optional second-pass filter)
  # Detects snare bleed by comparing FundE/BodyE ratio and total energy
  # against the median values across all detected kicks
  enable_statistical_filter: false    # Enable/disable statistical outlier detection
  statistical_badness_threshold: 0.3  # Badness score threshold (0-1)
                                      # Higher = more permissive (0.6-0.7 recommended)
                                      # Lower = stricter filtering (0.4-0.5 very strict)
  statistical_ratio_weight: 0.7       # Weight for FundE/BodyE ratio deviation (0-1)
  statistical_total_weight: 0.3       # Weight for total energy deviation (0-1)
  
snare:
  # MIDI note mappings (General MIDI standard)
  midi_note: 38               # D1 - Acoustic Snare (default)
  midi_note_rimshot: 37       # C#1 - Side Stick (Rimshot)
  midi_note_clap: 39          # D#1 - Hand Clap
  
  # Pitch detection for classification (snare/rimshot/clap)
  enable_pitch_detection: false  # Enable pitch-based classification (experimental)
  pitch_method: 'yin'            # Pitch detection method: 'yin' or 'pyin'
  min_pitch_hz: 100.0            # Minimum expected pitch (Hz)
  max_pitch_hz: 500.0            # Maximum expected pitch (Hz)
  
  # Stereo processing
  use_stereo: true  # Ghost notes and rimshots may be panned, use stereo analysis
  
  # Clustering configuration
  onset_merge_window_ms: 100  # Merge L/R onsets within this window (ms)
  expected_clusters: 2        # Expected number of distinct snare sounds (2=snare+clap, 1=all snare)
  
  # Detection method selection (NEW: energy-based is default)
  # use_librosa_detection: false  # Set to true for A/B testing with old method
  
  # Energy-based detection parameters
  threshold_db: 10.0              # Lower threshold catches ghost notes
  min_peak_spacing_ms: 80.0       # Snare rolls can be fast
  min_absolute_energy: 0.015      # Medium noise floor
  merge_window_ms: 150.0          # L/R merge window
  energy_method: 'peak_hold'      # Envelope calculation method
  peak_hold_ms: 3.0               # Peak-hold smoothing window
  
  # Onset detection (LEGACY - only used if use_librosa_detection: true)
  onset_threshold: 0.2          # Snares are loud and transient
  onset_wait: 2                 # ~22ms minimum spacing
  
  # Spectral filtering uses FFT analysis to distinguish real snare hits from artifacts
  # Real snare has energy in both body (150-400Hz) and wires (2-8kHz)
  # Artifacts (clicks, bleed) have low energy in both ranges
  
  geomean_threshold: 40.0   # Geometric mean of body+wire energy
                              # Real snares: 250-1200, Artifacts: 20-100
                              # Set to 100 to be conservative (catches all real snares)
                              # Increase to 150-200 for stricter filtering
  
  # Spectral ranges for analysis (Hz)
  low_freq_min: 40           # Start of low frequency range (kick bleed)
  low_freq_max: 150          # End of low frequency range
  body_freq_min: 150         # Start of snare body range
  body_freq_max: 400         # End of snare body range
  wire_freq_min: 2000        # Start of snare wire range
  wire_freq_max: 8000        # End of snare wire range

toms:
  # Tom drums settings
  midi_note_low: 45      # A1 - Low Tom
  midi_note_mid: 47      # B1 - Mid Tom  
  midi_note_high: 50     # D2 - High Tom
  
  # Stereo processing
  use_stereo: true  # Toms are often panned left to right, use stereo for identification
  
  # Clustering configuration
  onset_merge_window_ms: 100  # Merge L/R onsets within this window (ms)
  expected_clusters: 3        # Expected number of distinct tom sounds (3=high/mid/low)
  
  # Detection method selection (NEW: energy-based is default)
  # use_librosa_detection: false  # Set to true for A/B testing with old method
  
  # Energy-based detection parameters
  threshold_db: 6.0               # Lower threshold catches softer hits
  min_peak_spacing_ms: 90.0       # Medium spacing for tom fills
  min_absolute_energy: 0.015      # Medium noise floor
  merge_window_ms: 150.0          # L/R merge window
  energy_method: 'peak_hold'      # Envelope calculation method
  peak_hold_ms: 3.0               # Peak-hold smoothing window
  
  # Pitch detection for automatic low/mid/high classification
  enable_pitch_detection: true   # Detect pitch and assign to low/mid/high tom notes
  pitch_method: 'yin'            # Pitch detection algorithm: 'yin' or 'pyin' (more robust but slower)
  min_pitch_hz: 60               # Minimum expected tom pitch (low floor tom ~60Hz)
  max_pitch_hz: 250              # Maximum expected tom pitch (high rack tom ~250Hz)
  
  # Spectral filtering (similar to kick/snare)
  geomean_threshold: 80.0        # Geometric mean of fundamental+body energy
                                  # Real toms: 150-600, Artifacts: 20-80
                                  # Set to 80 to be conservative
  
  # Spectral ranges for analysis (Hz)
  fundamental_freq_min: 60       # Start of fundamental range (deep toms)
  fundamental_freq_max: 150      # End of fundamental range
  body_freq_min: 150             # Start of body/attack range
  body_freq_max: 400             # End of body/attack range
  
hihat:
  # MIDI note mappings (General MIDI standard)
  midi_note_closed: 42       # F#1 - Closed hi-hat
  midi_note_open: 46         # A#1 - Open hi-hat
  midi_note_foot_close: 44   # G#1 - Foot close (pedal closes open hihat)
  midi_note_handclap: 39     # D#1 - Hand Clap (detected from hihat bleed)
  midi_note: 42              # Default (closed) for backward compatibility
  
  # Stereo processing
  use_stereo: true  # Hi-hat may be off-center, use stereo for better detection
  
  # Amplitude normalization (helps with quiet hihat recordings)
  normalize_amplitude: true        # Override global setting - hihats benefit most from normalization
  normalize_stereo_balance: true   # Equalize L/R channels
  
  # Clustering configuration
  onset_merge_window_ms: 20   # Merge onsets within this window (faster patterns)
  expected_clusters: 2        # Expected number of distinct hihat sounds (open + closed)
  
  # Foot close generation
  generate_foot_close: false  # Generate foot-close events at end of open hihat sustain
  
  # Energy-based detection parameters (calibrated for sensitive detection)
  threshold_db: 6.0               # Lower threshold to catch quiet hits
  min_peak_spacing_ms: 20.0       # Hi-hats can be VERY fast (16th notes, 32nd notes)
  min_absolute_energy: 0.008      # Lower noise floor (hi-hats are quieter)
  merge_window_ms: 40.0           # Tighter L/R merge window for fast patterns
  enable_amplitude_refinement: false  # Hihat has clean transients, doesn't need two-pass
  energy_method: 'peak_hold'      # Envelope calculation method
  peak_hold_ms: 3.0               # Peak-hold smoothing window
  
  # Onset detection (LEGACY - only used if use_librosa_detection: true)
  # Very sensitive settings optimized through testing
  onset_threshold: 0.003    # Very sensitive to catch quiet hits
  onset_delta: 0.005        # Low threshold for peak picking
  onset_wait: 3             # ~33ms min spacing (allows fast 16th notes)
  
  # Open/Closed hi-hat classification - always enabled using threshold parameters below
  decay_threshold: 0.65      # Threshold for open detection (higher = fewer open detections)
  open_sustain_ms: 100       # Open hi-hat sustain threshold (ms): >=100ms = open
  open_geomean_min: 262.0    # Open hi-hat GeoMean threshold: >=262 = open
  min_sustain_ms: 25         # Minimum sustain for artifact filtering (handclaps ~20ms, real hihats >25ms)
  
  # Classification logic: Open = (GeoMean >= open_geomean_min) AND (SustainMs >= open_sustain_ms)
  # Closed = everything else that passes geomean_threshold
  
  # Spectral filtering
  min_strength_threshold: 0.02  # Minimum onset strength - keep quiet hits
  geomean_threshold: 8.0       # Geometric mean of body (500-2kHz) + sizzle (6-12kHz) energy
                                # Real hi-hats: 15-400, Artifacts: 1-10
                                # Lower threshold keeps more quiet hits
  
  # Spectral ranges for analysis (Hz)
  body_freq_min: 500         # Start of body/attack range (hi-hats are bright)
  body_freq_max: 2000        # End of body range
  sizzle_freq_min: 6000      # Start of sizzle/shimmer range (key characteristic)
  sizzle_freq_max: 12000     # End of sizzle range
  
cymbals:
  # MIDI note mappings (General MIDI standard)
  midi_note: 57              # Default: Crash 2 (right) for backward compatibility
  midi_note_crash: 49        # C#2 - Crash Cymbal 1
  midi_note_ride: 51         # D#2 - Ride Cymbal 1
  midi_note_chinese: 52      # E2 - Chinese Cymbal
  
  # Stereo processing
  use_stereo: true  # Cymbals are often panned left/right, use stereo for crash/ride distinction
  
  # Clustering configuration
  onset_merge_window_ms: 100  # Merge L/R onsets within this window (ms)
  expected_clusters: 2        # Expected number of distinct cymbals (e.g., 2=left crash + right crash)
  
  # Energy-based detection parameters (validated - cleaner than librosa)
  threshold_db: 15.0              # Prominence threshold
  min_peak_spacing_ms: 100.0      # Minimum spacing between peaks
  min_absolute_energy: 0.01       # Noise floor threshold
  merge_window_ms: 150.0          # L/R merge window
  energy_method: 'peak_hold'      # Envelope calculation method
  peak_hold_ms: 3.0               # Peak-hold smoothing window
  
  # Onset detection (LEGACY - only used if use_librosa_detection: true)
  onset_threshold: 0.35      # High threshold - only detect strong crashes
  onset_delta: 0.1           # Higher delta for stricter peak picking
  onset_wait: 10             # 10 frames = ~115ms min spacing
  
  # Sustain analysis and decay pattern detection
  sustain_analysis_window_sec: 2.0  # Window size for measuring cymbal sustain duration (seconds)
                              # How long to analyze audio to detect full cymbal ring-out
                              # Longer = more accurate sustain measurement, typical: 2-3 seconds
  decay_filter_window_sec: 0.5  # Window size for decay pattern retriggering filter (seconds)
                              # How far back to check for overlapping cymbal decays
                              # Shorter = allows faster repeated hits, typical: 0.3-0.5 seconds
  
  # Spectral filtering (filters artifacts and bleed using frequency analysis)
  enable_spectral_filter: true  # Enable/disable spectral filtering entirely. Set to false to keep ALL detected onsets
  min_strength_threshold: 0.1  # Minimum onset strength (0-1). Set to 0.0 to disable, increase to filter weak detections
  geomean_threshold: 100      # Geometric mean of body (1-4kHz) + brilliance (4-10kHz) energy
                              # Real cymbals: 50-500, Artifacts: 5-20
                              # Set lower (30-50) for more permissive, higher (100-200) for stricter
  min_sustain_ms: 150        # Minimum sustain duration in milliseconds
                              # Real cymbal hits sustain longer than clicks/artifacts
                              # Typical values: 100-200ms
  
  # Spectral ranges for analysis (Hz)
  body_freq_min: 1000        # Start of body/wash range (fundamental cymbal tone)
  body_freq_max: 4000        # End of body range
  brilliance_freq_min: 4000  # Start of brilliance/attack range (bright shimmer)
  brilliance_freq_max: 10000 # End of brilliance range
  
  # MIDI note duration
  max_note_duration: 2.0     # Maximum MIDI note duration in seconds
                              # Uses actual sustain duration from envelope analysis
                              # Allows long cymbal crashes to ring out naturally

# Clustering Configuration (for adaptive threshold discovery)
clustering:
  method: 'dbscan'           # Clustering algorithm: 'dbscan' (density-based) or 'kmeans' (centroid-based)
  features:                  # Features to include in clustering (order matters for weighting)
    - 'pan_confidence'       # Primary: (R-L)/(R+L) strength differential between channels
    - 'spectral_centroid'    # Secondary: Brightness/timbre of onset
    - 'pitch'                # Secondary: Detected fundamental frequency
    - 'timing_delta'         # Secondary: Time since previous onset

# Threshold Optimization (iterative adjustment to match expected cluster count)
threshold_optimization:
  enabled: false             # Enable adaptive threshold discovery (opt-in)
  max_iterations: 20         # Maximum optimization iterations before giving up
  tolerance: 0               # Stop when cluster_count within ±N of expected (0 = exact match)
  initial_threshold_step: 0.05  # Initial step size for threshold adjustments
  convergence_patience: 3    # Stop if no improvement for N iterations

# MIDI Output Settings
midi:
  min_velocity: 80           # Minimum MIDI velocity (1-127)
  max_velocity: 110          # Maximum MIDI velocity
  default_tempo: 120.0       # Default tempo in BPM (matches DAW defaults like Logic Pro)
  max_note_duration: 0.5     # Maximum duration for any note (seconds)
  
# Debug Output
debug:
  show_all_onsets: true      # Show detailed analysis of all detected onsets
  show_spectral_data: true   # Show spectral energy values (BodyE, WireE, etc)

# Threshold Learning Mode
# This workflow helps calibrate thresholds for your specific drum recordings
learning_mode:
  enabled: false                    # Enable learning mode
  export_all_detections: true       # Export ALL detected onsets (even rejected ones)
  rejected_velocity: 1               # Velocity for rejected hits (so you can see them)
  kept_velocity_normal: true         # Use normal velocity calculation for kept hits
  
  # In learning mode, use very sensitive detection to catch everything
  learning_onset_threshold: 0.0001    # Very low threshold to catch all possible hits
  learning_delta: 0.002              # Very sensitive peak picking
  learning_wait: 1                   # Allow very close hits
  
  # Output locations for learning workflow
  learning_midi_suffix: "_learning"  # Suffix for learning MIDI files
  calibrated_config_output: "midiconfig_calibrated.yaml"  # Where to save learned config
