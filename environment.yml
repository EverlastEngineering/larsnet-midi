name: drumtomidi
channels:
  - conda-forge
  - pytorch
dependencies:
  # ============================================================================
  # Python Interpreter
  # ============================================================================
  - python=3.11
  
  # ============================================================================
  # Core Scientific Computing
  # ============================================================================
  - numpy>=1.24.0
  - scipy>=1.10.0
  - pandas
  
  # ============================================================================
  # Deep Learning (PyTorch)
  # Conda manages platform-specific builds (CPU/CUDA/MPS)
  # ============================================================================
  - pytorch>=2.0.0
  - torchaudio>=2.0.0
  
  # ============================================================================
  # Audio Processing
  # ============================================================================
  - librosa>=0.10.0
  # pysoundfile name is deprecated, we're asked to use soundfile
  # but no conda package seems to exist
  - pysoundfile>=0.12.0
  
  # ============================================================================
  # Machine Learning (optional but recommended for tom pitch classification)
  # ============================================================================
  - scikit-learn>=1.3.0
  
  # ============================================================================
  # Configuration and Utilities
  # ============================================================================
  - pyyaml>=6.0
  - ruamel.yaml>=0.17.0
  - tqdm>=4.60.0
  
  # ============================================================================
  # Testing and Code Quality
  # ============================================================================
  - pytest>=7.0.0
  - pytest-cov>=4.0.0
  - ruff>=0.1.0
  
  # ============================================================================
  # Web UI (Flask)
  # ============================================================================
  - flask>=2.3.0
  - flask-cors>=4.0.0
  - werkzeug>=2.3.0
  
  # ============================================================================
  # System Libraries (conda manages these better than pip)
  # Note: libgomp removed - Linux/Windows only, Mac uses libomp automatically
  # ============================================================================
  - libopenblas
  
  # ============================================================================
  # Additional system dependencies
  # ============================================================================
  - zlib
  - bzip2
  - xz
  
  # ============================================================================
  # Pip-only packages (not available or better from PyPI)
  # ============================================================================
  - pip
  - pip:
      # MIDI handling
      - midiutil>=1.2.1
      - mido>=1.3.0

      # Video rendering (headless for Docker/server environments)
      - opencv-python-headless>=4.8.0

      # GPU-accelerated rendering
      - moderngl>=5.8.0
      - moderngl-window>=2.4.0

      # Documentation (optional - for building docs)
      - mkdocs>=1.5.0
      - mkdocs-material>=8.5.0
      - mkdocstrings[python]>=0.21.0
      - pdoc>=14.0.0
      - mkdocs-autorefs>=0.5.0
